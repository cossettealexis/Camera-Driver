<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>K26 Settings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(to bottom, #0f1115 0%, #1a1d24 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: #98a2b3;
        }

        .footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
        }

        .version-info {
            display: inline-block;
            text-align: left;
        }

        .version-info span {
            display: block;
            font-size: 13px;
            color: #98a2b3;
            margin: 4px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>K26 Camera</h1>
        <p>Outdoor Camera Settings</p>
    </div>

    <footer class="footer">
        <div class="version-info">
            <span id="deviceVersion">Device: Loading...</span>
            <span id="firmwareVersion">Firmware: Loading...</span>
            <span id="releaseDate">Release: Loading...</span>
        </div>
    </footer>

    <script src="javascript/index.js" type="text/javascript"></script>
</body>
</html>
