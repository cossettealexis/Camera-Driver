<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DF511 Door Lock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        img {
            max-width: 100%;
        }

        html {
            height: 100%;
        }

        body {
            background: linear-gradient(to bottom, #e7e7e7 0%, #bec0c3 100%);
            font-family: "Poppins", sans-serif;
            padding: 0;
            min-height: 100%;
            overflow: hidden;
        }

        .smartlockui {
            min-height: 100vh;
            background: linear-gradient(to bottom, #e7e7e7 0%, #bec0c3 100%) !important;
            /* Remove display:none logic entirely — let it render immediately */
            visibility: visible;
            opacity: 1;
        }

        /* ── Header ── */
        .header {
            padding: 10px 15px;
            text-align: center;
            background: #1a2228;
            margin-bottom: 10px;
        }

        .header img {
            max-height: 40px;
        }

        /* ── Battery ── */
        .status_blk {
            display: flex !important;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 10px;
        }

        .status_blk p {
            font-size: 14px;
            font-weight: 300;
            margin-bottom: 0;
            color: #444;
        }

        i.battery-icon {
            height: 13px;
            width: 26px;
            top: -1px;
            background-color: #fff;
            border: 2px solid #000;
            display: inline-block;
            position: relative;
            vertical-align: middle;
        }

        i.battery-icon:after,
        i.battery-icon:before {
            background: #000;
            content: '';
            position: absolute;
        }

        i.battery-icon:before {
            width: 2px;
            bottom: 1px;
            right: -4px;
            top: 1px;
        }

        i.battery-icon:after {
            bottom: 2px;
            left: 2px;
            top: 2px;
        }

        i.battery-icon[data-percent="100"]:after {
            right: 2px;
            background-color: #49db49;
        }

        i.battery-icon[data-percent="75"]:after {
            right: 6px;
            background-color: #49db49;
        }

        i.battery-icon[data-percent="50"]:after {
            right: 10px;
            background-color: #49db49;
        }

        i.battery-icon[data-percent="25"]:after {
            right: 16px;
            background-color: orange;
        }

        i.battery-icon[data-percent="10"]:after {
            right: 18px;
            background-color: red;
        }

        i.battery-icon[data-percent="10"]:after {
            right: 18px;
            background-color: red;
        }

        i.battery-icon[data-percent="10"] {
            border-color: #ff0000;
            animation: battBlink 1.2s ease-in-out infinite;
        }

        i.battery-icon[data-percent="25"] {
            border-color: orange;
        }

        @keyframes battBlink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.2;
            }
        }

        /* ── Smart Lock ── */
        .smart_lock_btn .lock_icon {
            display: none;
        }

        .smart_lock_wrap {
            min-height: calc(100vh - 105px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .smart_lock_inner {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: -80px !important;
        }

        .smart_lock_btn {
            width: 100%;
            max-width: 280px;
            height: 280px;
            border-radius: 100%;
            background: radial-gradient(ellipse at center, #fbe6d2 0%, #eb819d 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border: 25px solid #d42b57;
            position: relative;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        .smart_lock_btn.lock {
            background: radial-gradient(ellipse at center, #e4efe9 0%, #93a5cf 100%);
            border-color: #00aaff;
        }

        .smart_lock_btn span {
            width: 100%;
            text-align: center;
        }

        .smart_lock_btn span svg {
            height: 90px;
        }

        .smart_lock_btn.lock .unlock_icon {
            display: none;
        }

        .smart_lock_btn.lock .lock_icon {
            display: block;
        }

        .lock_status {
            margin-top: 10px;
            font-size: 14px;
            color: #455a64;
            font-weight: 600;
        }

        .smart_lock_btn img {
            max-width: 130px;
        }

        .circle-shade {
            position: absolute;
            width: 280px !important;
        }

        .circle-shade circle {
            stroke-dasharray: 296 296;
            stroke-dashoffset: 296;
            animation: grow 2s ease-out infinite;
            stroke-width: 6;
        }

        .circle-shade .lock {
            stroke: #ad1c42;
        }

        .circle-shade .unlock {
            stroke: #099ce3;
        }

        @keyframes grow {
            100% {
                stroke-dashoffset: 0;
            }
        }

        /* Bottom Menu */
        .bottom-menu {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            border-radius: 8px;
            padding: 10px 20px;
            box-shadow: 0 8px 8px rgba(0, 0, 0, 0.25);
            display: flex;
            gap: 24px;
        }

        .menu-item {
            text-align: center;
            cursor: pointer;
        }

        /* Device Name Panel */
        .panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #e7e7e7 0%, #bec0c3 100%);
            transform: translateY(100%);
            transition: transform 0.4s ease;
            z-index: 1000;
        }

        .panel.active {
            transform: translateY(0);
        }

        .topbar {
            padding: 16px;
            display: flex;
            align-items: center;
            background: #1a2228;
            color: white;
        }

        .content {
            padding: 50px 20px;
            text-align: center;
        }

        input {
            width: 100%;
            max-width: 280px;
            padding: 14px 16px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 12px;
            font-size: 16px;
            margin: 20px 0;
        }

        .btn {
            background: #ad1c42;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 32px 24px;
            border-radius: 8px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            box-shadow: 0 8px 8px rgba(0, 0, 0, 0.3);
        }

         .modal-content svg {
            margin: auto !important;
        }

        /* Success Popup - Your Original Style */
        .sucess_popup {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: #fff;
            border-radius: 200px;
            padding: 12px 30px;
            color: #1a2228;
            border: 2px solid #1a2228;
            display: none;
            text-align: center !important;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>

    <div class="sucess_popup">Success</div>
    <div class="overlay"></div>

    <div class="smartlockui">

        <header class="header">
            <img src="images/slomins-logo-new-white.png" alt="Slomins" />
        </header>
        <div class="status_blk">
            <div class="battery-wrapper">
                <i class="battery-icon" id="batteryIcon" data-percent="100"></i>
                <span class="battery-percent" id="batteryText"></span>
            </div>
        </div>


        <!-- ============================================================== -->
        <div class="smart_lock_wrap">
            <div class="smart_lock_inner">
                <button class="smart_lock_btn" id="lockBtn"
                    style="touch-action: manipulation; -webkit-tap-highlight-color: rgba(0,0,0,0);">
                    <svg class="circle-shade" viewBox="0 0 100 100" style="display: none;">
                        <circle class="lock" cx="50" cy="50" r="47" transform="rotate(-90 50 50)" pointer-events="all"
                            stroke-width="6" fill="none" />
                    </svg>
                    <span class="unlock_icon">
                        <img src="images/unlock.png" alt="Unlock" />
                    </span>
                    <span class="lock_icon">
                        <img src="images/lock.png" alt="Lock" />
                    </span>
                    <span class="lock_status">Hold to lock</span>
                </button>
            </div>
        </div>
    </div>
    <!-- Bottom Menu -->
    <div class="bottom-menu">
        <div class="menu-item" onclick="showDeviceNamePanel()">
            <i data-lucide="edit-3" style="width:28px;height:28px;color:#333;"></i>
            <div style="font-size:13px;color:#333;margin-top: 12px;">Device Name</div>
        </div>
    </div>

    <!-- Device Name Panel -->
    <div id="deviceNamePanel" class="panel">
        <div class="topbar">
            <button onclick="hideDeviceNamePanel()"
                style="background:none;border:none;color:white;font-size:28px;margin-right:12px;">←</button>
            <h4>Device Name</h4>
        </div>
        <div class="content">
            <i data-lucide="edit-3" style="width:64px;height:64px;color:#ad1c42;margin-bottom:16px;"></i>
            <div style="font-size:22px;font-weight:700;margin-bottom:8px;color:#222;">Set Device Name</div>
            <div style="color:#555;margin-bottom:24px;">Custom name for this lock</div>

            <input type="text" id="deviceNameInput" placeholder="Enter device name" maxlength="32">
            <button class="btn" id="updateNameBtn">Update Name</button>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <i data-lucide="check-circle" style="width:60px;height:60px;color:#4ade80;"></i>
            <h2 style="margin:16px 0 8px;color:#222;">Success</h2>
            <p id="modalMessage" style="color:#555;">Device name updated successfully!</p>
            <button class="btn" onclick="closeModal()" style="margin-top:20px;">OK</button>
        </div>
    </div>
    <script>
        lucide.createIcons();

        let isLocked = true;

        document.getElementById('lockBtn').addEventListener('click', () => {
            isLocked = !isLocked;
            const icon = document.getElementById('lockIcon');
            const status = document.getElementById('lockStatus');

            icon.setAttribute('data-lucide', isLocked ? 'lock' : 'unlock');
            status.textContent = isLocked ? "Locked" : "Unlocked";
            lucide.createIcons();
        });

        // Device Name Panel
        function showDeviceNamePanel() {
            document.getElementById('deviceNamePanel').classList.add('active');
        }

        function hideDeviceNamePanel() {
            document.getElementById('deviceNamePanel').classList.remove('active');
        }



        function showModal(message) {
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('successModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('successModal').classList.remove('show');
        }
    </script>

    <script src="js/jquery-3.7.1.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="javascript/index.js?v=3" type="text/javascript"></script>
</body>

</html>
